  /v2/public/actions/{token}:
    get:
      description: "This endpoint is the second step in the onboarding process (and is continually used thereafter using polling\
        \ mechanism)\n\n1. After a session is created using the InitOnboarding endpoint and a `token` is generated.\n2. Clients\
        \ poll this endpoint with the `token` to retrieve the current step.\n3. Depending on the response, the client may\
        \ need to collect specific data or perform certain actions\n   before calling `Submit` with that data.\n   When the\
        \ node type is `externalData`, inspect `expectedFields` to know exactly which payload fields must be submitted to\
        \ `submitUrl`.\n4. The client can then poll again to see if new steps are required or if the process has finished.\n\
        Possible values are `running`, `pending`, `failed` or `completed`. Whenever `pending` is returned, the client should\
        \ stop polling and submit the required payload according to the step type."
