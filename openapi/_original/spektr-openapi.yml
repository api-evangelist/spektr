              title: date
            - $ref: '#/components/schemas/StringListField'
              title: stringList
            - $ref: '#/components/schemas/CountryListField'
              title: countryList
            - $ref: '#/components/schemas/CurrencyListField'
              title: currencyList
            - $ref: '#/components/schemas/FileField'
              title: file
            - $ref: '#/components/schemas/ConditionalField'
              title: conditional
            - $ref: '#/components/schemas/EntityField'
              title: entity
            - $ref: '#/components/schemas/UiField'
              title: ui
          example:
          - id: efdca216-e300-44cb-bb77-2810bf832212
            type: input
            dataType: string
            config:
              spektrDataField: company_name
              value: Test APS
            attributes:
              type: text
              placeholder: Acme Inc.
              internalId: ''
              label: Company name
              name: Company name
            validation:
            - type: required
              value: true
              message: This field is required
            - type: regex
              value: ^[a-zA-Z0-9 ]+$
              message: Only alphanumeric characters and spaces are allowed
          - id: age-field
            type: input
            dataType: number
            config:
              spektrDataField: age
              value: 30
            attributes:
              type: number
              placeholder: Enter your age
              label: Age
              name: Age
            validation:
            - type: required
              value: true
              message: Age is required
            - type: regex
              value: ^[0-9]+$
              message: Only numbers are allowed
          - id: conditional-field
            type: conditional
            dataType: conditional
            config:
              spektrDataField: conditional_field
              value: show_if_true
            segment: {}
            output: show
            form:
              fields:
                nested-field-1:
                  type: input
                  dataType: string
                  config:
                    spektrDataField: nested_field
                    value: ''
                  attributes:
                    type: text
                    placeholder: Only shown conditionally
                    label: Nested Field
                    name: Nested Field
                  validation:
                  - type: required
                    value: true
                    message: This field is required
              order:
              - nested-field-1
          - id: entity-field
            type: entity
            dataType: entity
            config:
              spektrDataField: beneficial_owners
              value: ''
            attributes:
              label: Beneficial Owners
              name: Beneficial Owners
              helperText: Add all individuals who own 25% or more of the company
              buttonText: Add Owner
              labelField: first_name
              category: UBO
            validation:
            - type: required
              value: true
              message: At least one owner is required
            form:
              fields:
                first-name:
                  type: input
                  dataType: string
                  config:
                    spektrDataField: first_name
                    value: ''
                  attributes:
                    type: text
                    placeholder: First Name
                    label: First Name
                    name: First Name
                  validation:
                  - type: required
                    value: true
                    message: First name is required
                  - type: regex
                    value: ^[a-zA-Z ]+$
                    message: Only letters and spaces are allowed
                last-name:
                  type: input
                  dataType: string
                  config:
                    spektrDataField: last_name
                    value: ''
                  attributes:
                    type: text
                    placeholder: Last Name
                    label: Last Name
                    name: Last Name
                  validation:
                  - type: required
                    value: true
                    message: Last name is required
                  - type: regex
                    value: ^[a-zA-Z ]+$
                    message: Only letters and spaces are allowed
              order:
              - first-name
              - last-name
          - id: date-field
            type: input
            dataType: date
            config:
              spektrDataField: birth_date
              value: 946684800
            attributes:
              type: date
              placeholder: Enter your birth date
              label: Birth Date
              name: Birth Date
            validation:
            - type: required
              value: true
              message: Birth date is required
            - type: age
              minimumAge: 18
              message: You must be at least 18 years old
      required:
      - type
      - fields
