openapi: 3.0.0
info:
  title: Spektr API
  description: Spektr is an AI-powered compliance automation platform for financial institutions. The API manages datasets
    and customer record imports, process execution and onboarding orchestration, event and transaction ingestion, workspace
    field definitions, and webhooks for KYB/KYC onboarding, monitoring, and transaction-monitoring workflows.
  version: v2.23
servers:
- url: https://ingest.spektr.com
paths:
  /v1/data:
    post:
      description: Create a new dataset with a specified schema that allows to be used in processes. The schema defines the
        structure of data entries. Once created, the dataset becomes available in the platform and can be connected to spektr
        processes. Optionally, provide a "parentDatasetId" to create the dataset as a child of an existing dataset, used for
        related entities.
      operationId: DataImportController_create_v1
      parameters:
      - name: idempotency-key
        in: header
        description: 'Optional unique key (1–255 chars) to ensure the request is processed only once. If a duplicate key is
          sent with the same request parameters, the original response is replayed. Replayed responses include the `idempotent-replayed:
          true` header.'
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCreateInput'
            examples:
              example:
                value:
                  name: dataset name
                  dataType:
                    first_name: string
                    age: number
                    passport: file
      responses:
        '201':
          description: Dataset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImportResponse'
        '400':
          description: Payload validation or parsing failed
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DataParseError'
                - $ref: '#/components/schemas/DataValidationError'
        '409':
          description: A request with this idempotency-key is currently being processed
        '422':
          description: idempotency-key has already been used with different request parameters
        '500':
          description: Dataset creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      security:
      - x-api-key: []
      summary: Create dataset
      tags:
      - Import API
  /v1/data/{datasetId}:
    put:
      description: 'This endpoint allows clients to submit data entries for a dataset, including fields that require file
        uploads. When a data entry includes a file field (e.g., "passport": "file.jpg"), the API responds with a unique id
        for the entry and a presigned URL for uploading the file directly to AWS S3.


        Upsert by "reference": records are matched to existing client records only by their "reference". If a data entry includes
        a "reference" that already exists in the workspace, that record is updated in place and keeps its original "spektrId";
        otherwise a new record is created with a newly generated "spektrId". A "reference" must be a non-empty string, cannot
        be the literal value "root", and must be unique across the workspace — duplicate references (repeated within the same
        batch or already assigned to another record) are rejected with 409 Conflict. Entries sent without a "reference" are
        always created as new.'
      operationId: DataImportController_update_v1
      parameters:
      - name: datasetId
        required: true
        in: path
        description: The ID of the dataset
        schema:
          type: string
      - name: idempotency-key
        in: header
        description: 'Optional unique key (1–255 chars) to ensure the request is processed only once. If a duplicate key is
          sent with the same request parameters, the original response is replayed. Replayed responses include the `idempotent-replayed:
          true` header.'
        required: false
        schema:
          type: string
      requestBody:
        required: true
        description: The request body should be a JSON object containing a "data" array. Each item in the array represents
          a data entry and should include fields as defined in your dataset schema ("first_name", "age", "passport") or workspace
          fields. For file fields like "passport", include the key with a string value. Each item may also include an optional
          top-level "reference" string. The "reference" field is reserved and may be sent even if it is not declared in the
          dataset schema; it is always accepted and stored. Any other field that is not part of the dataset schema or workspace
          fields is rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataUpdateInput'
            examples:
              example:
                value:
                  data:
                  - first_name: John
                    last_name: Doe
                    email: john.doe@email.com
                    passport: passport.jpg
                  - first_name: Jane
                    last_name: Smith
                    email: jane.smt@email.com
      responses:
        '201':
          description: Entries created successfuly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUpdateResponse'
        '400':
          description: Payload validation or parsing failed
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DataParseError'
                - $ref: '#/components/schemas/DataValidationError'
        '404':
          description: Dataset with provided ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: A request with this idempotency-key is currently being processed
        '422':
          description: idempotency-key has already been used with different request parameters
        '500':
          description: Dataset update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      security:
      - x-api-key: []
      summary: Import records
      tags:
      - Import API
    delete:
      description: Delete a dataset from the platform.
      operationId: DataImportController_delete_v1
      parameters:
      - name: datasetId
        required: true
        in: path
        description: The ID of the dataset
        schema:
          type: string
      responses:
        '204':
          description: Dataset deleted successfully
        '404':
          description: Dataset with provided ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Dataset is currently used by a process and cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataConflictError'
        '500':
          description: Dataset deletion failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      security:
      - x-api-key: []
      summary: Delete dataset
      tags:
      - Import API
  /v1/record/listOpenLoops:
    post:
      description: Get process pending runs for a given list of spektr IDs and/or reference IDs.
      operationId: RecordController_listOpenLoops_v1
      parameters: []
      requestBody:
        required: true
        description: An object containing an array of spektr IDs and reference IDs.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRecordIds'
      responses:
        '200':
          description: Process runs fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRunResponse'
        '400':
          description: Payload validation or parsing failed
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DataParseError'
                - $ref: '#/components/schemas/DataValidationError'
        '404':
          description: Process runs not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - x-api-key: []
      summary: Get pending process runs
      tags:
      - Records API
  /v1/record/{spektrId}:
    get:
      description: Fetch a customer record by its spektr ID
      operationId: RecordController_fetchRecord_v1
      parameters:
      - name: spektrId
        required: true
        in: path
        description: The spektr ID of the customer record
        schema:
          type: string
      - name: appendEntities
        required: false
        in: query
        description: Appends the ownership graph entities to the response
        schema:
          type: boolean
      responses:
        '200':
          description: Customer record fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
      security:
      - x-api-key: []
      summary: Fetch customer record
      tags:
      - Records API
    patch:
      description: Update a customer record by its spektr ID
      operationId: RecordController_updateRecord_v1
      parameters:
      - name: spektrId
        required: true
        in: path
        description: The ID of the customer record
        schema:
          type: string
      requestBody:
        required: true
        description: The data to update the customer record with. Optional createdAt/updatedAt (Unix ms) are applied only
          when they differ from stored values.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInput'
      responses:
        '200':
          description: Customer record updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
        '400':
          description: Payload validation or parsing failed, or attempted to update restricted fields
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DataParseError'
                - $ref: '#/components/schemas/DataValidationError'
        '404':
          description: Customer record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Reference already exists; must be unique across client records
      security:
      - x-api-key: []
      summary: Update customer record
      tags:
      - Records API
  /v2/record/{spektrId}:
    patch:
      description: Update a customer record by its spektr ID. The ID can be a spektr ID or a reference ID. The type of the
        ID is specified in the type query parameter. Provide at least one of a non-empty data object, status, or a timestamp
        field (createdAt / updatedAt in Unix ms).
      operationId: RecordController_updateRecordV2_v2
      parameters:
      - name: spektrId
        required: true
        in: path
        description: The ID of the customer record
        schema:
          type: string
      - name: type
        required: true
        in: query
        description: The type of the customer record id. Either spektrId or reference
        schema:
          enum:
          - spektrId
          - reference
          type: string
      requestBody:
        required: true
        description: 'Fields to update: optional golden-record data, optional workflow status, optional createdAt/updatedAt
          (Unix ms; applied only when changed).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInputV2'
      responses:
        '200':
          description: Customer record updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
        '400':
          description: Payload validation or parsing failed, or attempted to update restricted fields
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DataParseError'
                - $ref: '#/components/schemas/DataValidationError'
        '404':
          description: Customer record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Reference already exists; must be unique across client records
      security:
      - x-api-key: []
      summary: Update customer record v2
      tags:
      - Records API
  /v1/record/reference/{reference}:
    get:
      description: "Fetch a customer record by a client reference. \n\nUsage: \n - on the first onboarding init request, pass\
        \ the reference in the data\n - whenever the spektrId is needed, use this endpoint to fetch the \n   record using\
        \ your reference"
      operationId: RecordController_fetchRecordByReference_v1
      parameters:
      - name: reference
        required: true
        in: path
        description: The customer reference
        schema:
          type: string
      - name: appendFiles
        required: false
        in: query
        description: Appends the presigned file URLs to the response
        schema:
          type: boolean
      - name: appendEntities
        required: false
        in: query
        description: Appends the ownership graph entities to the response
        schema:
          type: boolean
      responses:
        '200':
          description: Customer record fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
      security:
      - x-api-key: []
      summary: Fetch customer record by reference
      tags:
      - Records API
  /v1/record/{spektrId}/timeline:
    get:
      description: Get form submits for a given record by its ID. If the ID is not found, an empty array is returned.
      operationId: RecordController_getClientRecordFormSubmits_v1
      parameters:
      - name: spektrId
        required: true
        in: path
        description: The ID of the customer record
        schema:
          type: string
      responses:
        '200':
          description: Customer form submits fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordFormSubmitsResponse'
      security:
      - x-api-key: []
      summary: Get form submits for a given record
      tags:
      - Records API
  /v1/record/bulk/fetch/api:
    get:
      description: Fetch multiple customer records and return them directly in the API response. Optimized for smaller datasets.
        Max 5000 records at a time
      operationId: RecordController_fetchRecordsApi_v1
      parameters:
      - name: createdAfter
        required: false
        in: query
        description: Unix timestamp (milliseconds) to fetch records created after this date
        schema:
          type: number
      - name: createdBefore
        required: false
        in: query
        description: Unix timestamp (milliseconds) to fetch records created before this date
        schema:
          type: number
      - name: updatedAfter
        required: false
        in: query
        description: Unix timestamp (milliseconds) to fetch records updated after this date
        schema:
          type: number
      - name: updatedBefore
        required: false
        in: query
        description: Unix timestamp (milliseconds) to fetch records updated before this date
        schema:
          type: number
      - name: maxCount
        required: true
        in: query
        description: Maximum number of records to fetch (limited to 5000)
        schema:
          type: number
      - name: token
        required: false
        in: query
        description: Pagination token for cursor-based pagination. Use the token from the response to fetch the next page
          of results.
        schema:
          example: 1769448798254_6977a55d0507d9fe9c85a90f
          type: string
      responses:
        '200':
          description: Returns records array with customer data directly in the response. Includes a token field for pagination
            if more records are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordsResponse'
      security:
      - x-api-key: []
      summary: Fetch records in bulk via API
      tags:
      - Records API
  /v1/record/bulk/fetch/s3:
    get:
      description: Fetch multiple customer records and return signed URLs to download them from S3. Handles large datasets
        by chunking data into multiple files. Max 300,000 records at a time. Data will be split into files of max 10,000 records.
      operationId: RecordController_fetchRecordsS3_v1
      parameters:
      - name: createdAfter
        required: false
        in: query
        description: Unix timestamp (milliseconds) to fetch records created after this date
        schema:
          type: number
      - name: createdBefore
        required: false
        in: query
        description: Unix timestamp (milliseconds) to fetch records created before this date
        schema:
          type: number
      - name: updatedAfter
        required: false
        in: query
        description: Unix timestamp (milliseconds) to fetch records updated after this date
        schema:
          type: number
      - name: updatedBefore
        required: false
        in: query
        description: Unix timestamp (milliseconds) to fetch records updated before this date
        schema:
          type: number
      - name: maxCount
        required: true
        in: query
        description: Maximum number of records to fetch (up to 300,000).
        schema:
          type: number
      - name: token
        required: false
        in: query
        description: Pagination token for cursor-based pagination. Use the token from the response to fetch the next page
          of results.
        schema:
          example: 1769448798254_6977a55d0507d9fe9c85a90f
          type: string
      responses:
        '200':
          description: Returns an array of presigned S3 URLs for downloading record chunks as JSON files
          content:
            application/json:
              schema:
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          description: Presigned URL to download the file
                  token:
                    type: string
                    description: Pagination token for fetching the next page of results. Present only when more records are
                      available.
      security:
      - x-api-key: []
      summary: Fetch records in bulk via S3
      tags:
      - Records API
  /v1/record/relations:
    post:
      description: 'Links two or more client records together (e.g. a company and its beneficial owners). Pass an array of
        relation items where each side (`from`, `to`) is identified by `spektrId` or `reference`. Each item must specify `relationRole`
        (one of the supported role keys such as `beneficial_owners`, `shareholders`, `ultimate_beneficial_owners`, `senior_management`,
        `board_of_directors`, `controlling_entities`, `subsidiaries`, `authorized_signatories`, `signatories`, `contact_info`,
        `person_with_significant_control`) and may include optional `data` metadata, `positions`, and a `direct` boolean.
        The legacy `roles` array is no longer accepted - send `relationRole` directly instead. The request is atomic: all
        relations are created together or none are, if any validation fails. Validation rules: both records must exist, `from`
        and `to` cannot be the same record, duplicate relations are rejected, and the resulting graph must remain acyclic.'
      operationId: RecordController_createClientRecordRelations_v1
      parameters: []
      requestBody:
        required: true
        description: Array of relations to create
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateClientRecordRelationItemDto'
      responses:
        '201':
          description: Relations created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientRecordRelationsResponseDto'
        '400':
          description: Payload validation failed or business rule violated (e.g. missing record, invalid role, cycle, from
            === to)
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DataParseError'
                - $ref: '#/components/schemas/DataValidationError'
      security:
      - x-api-key: []
      summary: Create client record relations
      tags:
      - Records API
    patch:
      description: Updates mutable fields on existing v2 client record relations identified by `(from, to, relationRole)`.
        Only `direct`, `positions`, and `data` may be modified; `from`, `to`, `relationRole`, `createdAt`, and `updatedAt`
        are immutable. The `data` field is shallow-merged with the stored value (provided keys overwrite, existing unspecified
        keys are preserved). Each item must include at least one of `direct`, `positions`, or `data`. All relations in the
        batch are verified to exist before any updates are applied; if any relation is missing, the entire request is rejected
        without persisting changes. Updates then run sequentially (best-effort after verification).
      operationId: RecordController_updateClientRecordRelations_v1
      parameters: []
      requestBody:
        required: true
        description: Array of relations to update
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UpdateClientRecordRelationItemDto'
      responses:
        '200':
          description: Relations updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientRecordRelationsResponseDto'
        '400':
          description: Payload validation failed or business rule violated (e.g. relation not found, duplicate key within
            the payload, no update fields provided, from === to, invalid role)
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DataParseError'
                - $ref: '#/components/schemas/DataValidationError'
      security:
      - x-api-key: []
      summary: Update client record relations
      tags:
      - Records API
  /v1/record/vendor-searches/{vendorSearchId}:
    get:
      description: Fetch the raw, unmodified response of a single vendor search (e.g. a Kyckr lookup) by its ID. The `vendorSearchId`
        is the reference carried on the customer's timeline service-run events and outbound webhook payloads.
      operationId: RecordController_getVendorSearch_v1
      parameters:
      - name: vendorSearchId
        required: true
        in: path
        description: The ID of the vendor search to fetch
        schema:
          type: string
      responses:
        '200':
          description: Vendor search fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorSearchResponse'
        '404':
          description: Vendor search not found for this customer record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - x-api-key: []
      summary: Fetch a vendor search
      tags:
      - Records API
  /v1/execution:
    post:
      description: Excute a process for a list of spektr IDs. The processId can be found in the spektr platform. The spektr
        IDs are generated through the Import API.
      operationId: ExecutionController_triggerProcess_v1
      parameters: []
      requestBody:
        required: true
        description: Details needed to execute the process
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionInput'
      responses:
        '200':
          description: Process excuted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
        '400':
          description: Payload validation or parsing failed
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DataParseError'
                - $ref: '#/components/schemas/DataValidationError'
        '404':
          description: Process with provided ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Process trigger failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      security:
      - x-api-key: []
      summary: Execute process
      tags:
      - Execution API
  /v2/execution:
    post:
      description: Execute a process for spektr IDs and/or reference IDs. Optionally provide email input and enable token
        refresh on version mismatch to ensure execution uses the latest process version.
      operationId: ExecutionController_executionV2_v2
      parameters: []
      requestBody:
        required: true
        description: Details needed to execute the process. The ids can be a spektr ID or a reference ID. The type of the
          ID is specified in the type property.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionInputV2'
      responses:
        '200':
          description: Process excuted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponseV2'
        '400':
          description: Payload validation or parsing failed
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DataParseError'
                - $ref: '#/components/schemas/DataValidationError'
        '404':
          description: Process with provided ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Process trigger failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      security:
      - x-api-key: []
      summary: Execute process v2
      tags:
      - Execution API
  /v3/execution:
    post:
      description: Execute a process for spektr IDs and/or reference IDs. Optionally provide email input and enable token
        refresh on version mismatch to ensure execution uses the latest process version.
      operationId: ExecutionController_executionV3_v3
      parameters: []
      requestBody:
        required: true
        description: Details needed to execute the process. The ids can be a spektr ID or a reference ID. The type of the
          ID is specified in the type property.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionInputV3'
      responses:
        '200':
          description: Process executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponseV3'
        '400':
          description: Payload validation or parsing failed
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DataParseError'
                - $ref: '#/components/schemas/DataValidationError'
        '404':
          description: Process with provided ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Process trigger failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      security:
      - x-api-key: []
      summary: Execute process v3
      tags:
      - Execution API
  /v1/public/actions/processId/{processId}/workspaceId/{workspaceId}:
    post:
      description: 'Creates a new onboarding session for your client. You can optionally prefill client data by submitting
        a payload in the request body. The response includes a session token that you can append to the onboarding URL: https://actions.spektr.com/form?token={token}
        to direct your client to the onboarding flow. If using a custom domain, replace actions.spektr.com with your domain.'
      operationId: ActionTicketController_createOnboarding_v1
      parameters:
      - name: processId
        required: true
        in: path
        description: The ID of the onboarding process template
        schema:
          type: string
      - name: workspaceId
        required: true
        in: path
        description: The ID of your workspace
        schema:
          type: string
      - name: idempotency-key
        in: header
        description: 'Optional unique key (1–255 chars) to ensure the request is processed only once. If a duplicate key is
          sent with the same request parameters, the original response is replayed. Replayed responses include the `idempotent-replayed:
          true` header.'
        required: false
        schema:
          type: string
      - name: x-spektr-block-until-ready
        in: header
        description: Set to 'true' to have the server wait until the onboarding session is ready to accept a submission before
