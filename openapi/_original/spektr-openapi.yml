  /v3/public/actions/{token}:
    post:
      description: 'Submits form data with support for deferred file uploads.


        **Integration Flow:**

        1. Submit form data including file names for any file fields

        2. If files need uploading, response includes presigned S3 URLs (status: `accepted`)

        3. Upload files to S3 using the presigned URLs (multipart form POST)

        4. Call `POST /:token/confirm` to verify uploads and complete submission


        **Response Status:**

        - `completed`: No files to upload, submission processed immediately

        - `accepted`: Files need uploading, use provided presigned URLs then call /confirm


        **File Upload:**

        When uploading to S3, send a multipart form POST to the `url` with:

        - All fields from the `fields` object as form fields

        - The file content as `file` field'
      operationId: OrchestrationController_submitV3_v3
      parameters:
      - name: token
        required: true
        in: path
        description: Session token
        schema:
          type: string
      - name: filledBy
        required: true
        in: query
        description: The name of the entity that filled the form
        schema:
          example: John Doe
          type: string
      requestBody:
        required: true
        description: Form submission data
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: Form
                description: 'A flat object where each key is a field name and each value can be one of the following types:


                  - string: Text values

                  - number: Numeric values

                  - boolean: true/false values

                  - date: Unix timestamp (milliseconds since epoch)

                  - stringList: Multiple string values

                  - entity: Array of objects representing ownership relations

                  - file: Filename as a string (file content uploaded separately via presigned URL)


                  **NOTE:** The UI in this documentation may only show "string" as the value type, but all types listed above
                  are accepted. Check the examples.


                  The fields from the conditional type should be included in the root of the object.'
                additionalProperties:
                  oneOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      type: string
                example:
                  company_name: Acme Corp
                  incorporation_date: 1622505600
                  document: company_registration.pdf
              - $ref: '#/components/schemas/SubmitHitHorizon'
                title: HitHorizon
              - $ref: '#/components/schemas/SubmitVeriff'
                title: Veriff
              - $ref: '#/components/schemas/SubmitMitId'
                title: MitId
              - $ref: '#/components/schemas/SubmitBankId'
                title: BankId
      responses:
        '200':
          description: Submission completed or accepted
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SubmitV3CompletedResponse'
                  title: Completed
                - $ref: '#/components/schemas/SubmitV3AcceptedResponse'
                  title: Accepted
        '400':
          description: Validation error (invalid data or file type not allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataValidationError'
        '401':
          description: Token is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      security:
      - x-api-key: []
      summary: Submit form data (V3)
      tags:
      - Orchestration API
  /v3/public/actions/{token}/confirm:
    post:
      description: 'Confirms that all file uploads are complete and triggers execution to resume.


        **Integration Flow:**

        1. Call after uploading all files from the `submitV3` response to S3

        2. If all files are present in S3, returns `completed` and resumes process execution

        3. If files are missing, throws 409 Conflict with new presigned URLs for retry


        **Response Status:**

        - `completed`: All files verified, execution resumed

        - `pending` (409 Conflict): Files missing, presigned URLs provided for retry


        **Retry Flow:**

        If 409 is returned, upload the missing files using the new presigned URLs and call confirm again.'
      operationId: OrchestrationController_confirmSubmission_v3
      parameters:
      - name: token
        required: true
        in: path
        description: Session token from InitOnboarding endpoint
        schema:
          type: string
      - name: filledBy
        required: true
        in: query
        description: The name of the entity that filled the form
        schema:
          example: John Doe
          type: string
      responses:
        '200':
          description: All files verified, execution resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmCompletedResponse'
        '400':
          description: Context status is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataValidationError'
        '401':
          description: Token is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '409':
          description: Files missing - presigned URLs provided for retry upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmPendingResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      security:
      - x-api-key: []
      summary: Confirm submission
      tags:
      - Orchestration API
  /v1/fields:
    post:
      description: 'Create a new workspace field definition. Field names must be unique within the workspace.


        **Flat fields** (e.g. `input`, `select`, `checkbox`, `file`) store a single scalar value per customer record (string,
        number, boolean, date, etc.). They do not use the `subFields` property.


        **Object fields** (`type: "object"`) store structured, nested data as a JSON array of objects. They **must** include
        a non-empty `subFields` array defining the schema for each entry. Sub-fields can themselves be of type `object`, enabling
        recursive nesting.


        '
      operationId: WorkspaceFieldsController_create_v1
      parameters: []
      requestBody:
        required: true
        description: The workspace field definition to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceFieldBody'
            examples:
              Flat field (input):
                summary: Simple text input field
                value:
                  type: input
                  category:
                  - company
                  attributes:
                    name: company_name
                    label: Company Name
                    type: text
                    placeholder: Acme Inc.
                  config:
                    spektrDataField: company_name
                  validation:
                  - type: required
                    value: true
                    message: Company name is required
                  locked: false
              Object field (nested):
                summary: Structured field with nested sub-fields
                value:
                  type: object
                  category:
                  - individual
                  attributes:
                    name: employers
                    label: Employers
                  config:
                    spektrDataField: employers
                  validation: []
                  locked: false
                  subFields:
                  - fieldName: full_name
                    fieldLabel: Full name
                    required: true
                    type: input
                    attributes:
                      name: full_name
                      label: Full name
                      type: text
                    validation:
                    - type: required
                      value: true
                      message: Required
                  - fieldName: address
                    fieldLabel: Address
                    required: false
                    type: object
                    subFields:
                    - fieldName: line1
                      fieldLabel: Address line 1
                      required: false
                      type: input
                      attributes:
                        name: line1
                        label: Address line 1
                        type: text
                    - fieldName: country
                      fieldLabel: Country
                      required: false
                      type: select
                      attributes:
                        name: country
                        label: Country
                        options:
                        - value: RO
                          label: Romania
                        - value: GB
                          label: United Kingdom
      responses:
        '201':
          description: Workspace field created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFieldResponse'
              examples:
                Flat field:
                  summary: Flat field response (input)
                  value:
                    id: 507f1f77bcf86cd799439011
                    type: input
                    attributes:
                      name: company_name
                      label: Company Name
                      type: text
                      placeholder: Acme Inc.
                    config:
                      spektrDataField: company_name
                    validation:
                    - type: required
                      value: true
                      message: Company name is required
                    category:
                    - company
                    groups: []
                    locked: false
                    protectedField: false
                    source: workspace
                    createdBy: 507f1f77bcf86cd799439012
                    createdAt: 1700000000000
                    updatedAt: 1700000000000
                Object field:
                  summary: Object field response (nested)
                  value:
                    id: 507f1f77bcf86cd799439013
                    type: object
                    attributes:
                      name: employers
                      label: Employers
                    config:
                      spektrDataField: employers
                    validation: []
                    category:
                    - individual
                    groups: []
                    locked: false
                    protectedField: false
                    source: workspace
                    subFields:
                    - fieldName: full_name
                      fieldLabel: Full name
                      required: true
