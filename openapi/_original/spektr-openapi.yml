          example: street_address
        fieldLabel:
          type: string
          description: Display label for the sub-field
          example: Street Address
        fieldHelp:
          type: string
          description: Help text for the sub-field
          example: Enter the full street address including number
        required:
          type: boolean
          description: Whether the sub-field is required
          example: true
        type:
          type: string
          description: Input type of the sub-field
          example: input
          enum:
          - input
          - radio
          - select
          - checkbox
          - file
          - optionSwitch
          - consent
          - multiSelectDropdown
          - multipleValuesInput
          - object
        attributes:
          description: Attributes for the sub-field
          allOf:
          - $ref: '#/components/schemas/FieldAttributesDto'
        validation:
          description: Validation rules for the sub-field
          type: array
          items:
            $ref: '#/components/schemas/FieldValidationDto'
        subFields:
          description: Nested sub-fields for recursive object structures. Required when the sub-field type is "object", must
            be omitted otherwise. On PATCH this array is **replaced wholesale** — partial merges are not supported.
          type: array
          items:
            $ref: '#/components/schemas/SubFieldDefinitionDto'
      required:
      - fieldName
      - fieldLabel
      - required
      - type
