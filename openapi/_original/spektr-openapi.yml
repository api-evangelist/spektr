          type: object
          description: Default or current value of the field
          example: Acme Inc.
        defaultValue:
          type: object
          description: Default value for the field
          example: Default Company
        prefillPreference:
          type: object
          description: Prefill preference configuration. `processSourceNodeIds` is optional; when omitted or empty, prefill
            considers all eligible upstream vendor nodes (current behavior). When set, prefill is restricted to the listed
            vendor node ids.
          example:
            process: true
            record: true
            processSourceNodeIds:
            - 507f1f77bcf86cd799439011
      required:
      - spektrDataField
