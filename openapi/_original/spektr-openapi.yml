      properties:
        type:
          type: string
          description: The form type
          enum:
          - form
        fields:
          type: array
          description: 'Each item represents a field in the form. NOTE: While represented as an array in the documentation,
            the actual payload is a dictionary/object where field ID is the key and the field properties are the value.'
          items:
            oneOf:
            - $ref: '#/components/schemas/StringField'
              title: string
            - $ref: '#/components/schemas/NumberField'
              title: number
