aid: spektr
name: Spektr
description: >-
  Spektr is an AI-powered compliance automation platform for banks and fintechs, backed by
  Northzone and Seedcamp. It automates KYB and KYC onboarding, continuous customer monitoring,
  risk scoring, remediation, and transaction monitoring using configurable processes and a
  library of AI agents (KYB, document review, network/ownership discovery, address and license
  verification, source-of-funds, and false-positive reduction). The REST API (documented on
  ReadMe at spektr.readme.io, served from ingest.spektr.com) covers dataset and customer-record
  import, process execution and onboarding orchestration, event and transaction ingestion,
  workspace field definitions, and HMAC-signed webhooks. Authentication is via an x-api-key
  header, with idempotency-key support and Live/Sandbox/Test environments.
